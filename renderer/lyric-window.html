<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌面歌词</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    html, body { background: transparent !important; overflow: hidden; height: 100%; }
    body { font-size: 14px; }
    .dl-wrap {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 6px 18px;
      -webkit-app-region: no-drag;
    }
    .dl-line {
      font-family: 'Noto Sans SC', 'IBM Plex Sans', sans-serif;
      font-weight: 600; line-height: 1.35; text-align: center;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      transition: color .25s ease;
      cursor: pointer;
      padding: 2px 10px; border-radius: 8px;
    }
    .dl-line--sub { font-size: .62em; opacity: .75; margin-top: 2px; -webkit-line-clamp: 1; }
    .dl-line:hover { background: rgba(255, 255, 255, 0.08); }
    .dl-empty { color: rgba(255, 255, 255, 0.5); font-size: 15px; text-align: center; }
    /* 悬停工具条：锁定 / 字号 / 关闭 */
    .dl-tools {
      position: fixed; top: 2px; right: 8px; display: flex; gap: 4px;
      opacity: 0; transition: opacity .18s ease; z-index: 10;
    }
    .dl-wrap:hover .dl-tools { opacity: 1; }
    .dl-tools button {
      width: 24px; height: 24px; border-radius: 7px; border: none;
      background: rgba(255, 255, 255, 0.12); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-family: inherit; cursor: pointer;
    }
    .dl-tools button:hover { background: rgba(255, 255, 255, 0.25); }
    .dl-tools button.is-on { background: var(--accent, #ff6a2c); color: #0d0c0a; }
    /* 锁定时整个窗口鼠标穿透，工具条也不显示 */
    .dl-wrap.is-locked .dl-tools { display: none; }
  </style>
</head>
<body>
  <div class="dl-wrap" id="dlWrap">
    <div class="dl-tools">
      <button id="dlLock" title="锁定（鼠标穿透）">🔒</button>
      <button id="dlFontDown" title="减小字号">A−</button>
      <button id="dlFontUp" title="增大字号">A＋</button>
      <button id="dlClose" title="关闭桌面歌词">✕</button>
    </div>
    <div class="dl-line" id="dlLine">孤男音乐</div>
    <div class="dl-line dl-line--sub" id="dlSub" style="display:none"></div>
  </div>
  <script type="module" src="./js/lyric-window.js"></script>
</body>
</html>
