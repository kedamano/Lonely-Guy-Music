# electron-builder 配置：孤男音乐 Windows 安装包
# 文档：https://www.electron.build/configuration
appId: com.guman.music
productName: 孤男音乐
copyright: Copyright © 2026 孤男音乐

directories:
  output: dist
  buildResources: build

# 只打必要文件；devDependencies 会被自动剪掉（playwright 等不进包）
files:
  - main.js
  - main-log.js
  - preload.js
  - assets/**
  - server/**
  - renderer/**
  - package.json
  - "!**/*.md"
  - "!**/*.map"

asar: true
# NCM 子进程用真实 node 进程 spawn app.js，asar 内的路径不是真实文件；
# 连同它自身依赖一起解出（npm 扁平安装，依赖就在 node_modules 下）。
asarUnpack:
  - "**/node_modules/**"

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
  # 产物名用 ASCII，避免中文文件名在部分工具链/杀软下出问题
  artifactName: GumanMusic-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 孤男音乐
  menuCategory: false
  # 安装包内嵌卸载器
  deleteAppDataOnUninstall: false

# ---- macOS（dmg 安装器 + zip 供自动更新）----
# 未签名：首次打开需在「系统设置 → 隐私与安全性」放行，或右键 → 打开。
mac:
  icon: build/icon.png
  category: public.app-category.music
  darkModeSupport: true
  # 没有 Apple 开发者证书时显式置空，避免 CI 因找不到签名身份而失败
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: GumanMusic-${version}-${arch}.${ext}

# ---- Linux（AppImage 免安装 + deb 包）----
linux:
  icon: build/icon.png
  category: AudioVideo
  synopsis: 桌面音乐客户端
  description: 孤男音乐 · 在线曲库 + 洛雪音源 + 实时频谱 + 卡拉OK歌词的桌面音乐客户端。
  maintainer: kedamano <1392806889@qq.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: GumanMusic-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: 孤男音乐
      GenericName: Music Player
      Comment: 桌面音乐客户端
      Categories: AudioVideo;Audio;Player;

# ---- 自动更新发布源（electron-updater）----
# 使用 GitHub Releases 作为更新源：应用启动时检查本仓库最新 Release 的 latest.yml。
# 打包时用 GH_TOKEN 环境变量，electron-builder 可直接上传（--publish always）。
# 自建服务器：改为 provider: generic + 实际 url。
publish:
  - provider: github
    owner: kedamano
    repo: Lonely-Guy-Music
    releaseType: release

# ---- 代码签名（可选，需要代码签名证书）----
# 未签名包会被 Windows SmartScreen 拦截，用户点「更多信息 → 仍要运行」即可安装。
# 有 OV/EV 证书后，在 CI/本机设置环境变量（不要把证书提交进仓库）：
#   CSC_LINK=path/to/cert.pfx   CSC_KEY_PASSWORD=xxx
# 或在下方配置（同样建议走环境变量）：
# certificateFile: ""
# certificatePassword: ""
