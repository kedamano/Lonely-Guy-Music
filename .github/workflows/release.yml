name: Release

# 打 tag（v1.2.0 这种）即触发：三平台并行构建 → 汇总上传到同一个 GitHub Release。
# 也可在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发版门禁：tag push 不匹配 ci.yml 的 branches 过滤，所以这里必须自带全量回归，
  # 并让三平台构建与发布 job 显式依赖它 —— 测试不过就绝不出包。
  test:
    name: 回归门禁（语法 + 全量 node-only）
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语法检查（跨平台）
        run: npm run check:syntax

      - name: 全量 node-only 回归（发版门禁）
        run: npm run check:all

  build:
    name: 构建 ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (NSIS)
            platform: win
          - os: macos-latest
            label: macOS (dmg + zip)
            platform: mac
          - os: ubuntu-latest
            label: Linux (AppImage + deb)
            platform: linux

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成字体与图标资源
        run: |
          npm run fonts
          npm run icons

      - name: 打包（Windows）
        if: matrix.platform == 'win'
        env:
          # 证书以 base64 存于 GitHub Secrets，绝不入库。未配置时两个变量为空，
          # electron-builder 会照常产出未签名包。见 docs/code-signing.md
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --publish never

      - name: 打包（macOS）
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          # 有证书才允许自动发现签名身份；无证书时保持关闭，避免 ad-hoc 签名构建失败
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          # 公证凭据三选一：Apple ID / App Store API Key / Keychain profile；不齐就只签名不公证
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}

      - name: 打包（Linux）
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: guman-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    name: 发布到 GitHub Releases
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建或更新 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加/覆盖资产"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "孤男音乐 $TAG" \
              --generate-notes
          fi
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name 'latest*.yml' -o -name '*.blockmap' \) \
            -print -exec gh release upload "$TAG" {} --repo "$GITHUB_REPOSITORY" --clobber \;
