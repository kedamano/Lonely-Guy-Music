name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: 语法检查 + 单测 + 打包 (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 与 release.yml 的 test job 共用同一套聚合脚本，避免两份测试清单漂移
      - name: 语法检查（主进程/渲染层/脚本，跨平台）
        run: npm run check:syntax

      - name: 全量 node-only 回归
        run: npm run check:all

      - name: 生成字体资源
        run: npm run fonts

      - name: 打包安装包
        run: npm run dist

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: guman-music-windows
          path: dist/*.exe
          if-no-files-found: error

# 说明：check:all 只聚合不需要 Electron / 浏览器 / 网易云网络的脚本（12 个），
# 保证 Runner 上稳定；需要真机 DOM 的 UI 回归请在本地起服务后单独跑：
#   node scripts/ui-smoke.js
#   node scripts/search-guide-check.js
#   GUMAN_NP_URL=http://127.0.0.1:3000/ node scripts/np-overlay-check.js
# 发版链路（release.yml 的 test job）跑的是完全相同的两条命令。
